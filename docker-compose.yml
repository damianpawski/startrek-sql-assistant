name: startrek-sql-assistant

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      # Required, deliberately no default: `:?` makes compose refuse to start
      # without a .env rather than fall back to a password published in this
      # repo. The same guard is repeated on sql-init and dab below.
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:?set MSSQL_SA_PASSWORD in .env - copy .env.example first}"
      MSSQL_PID: Developer
    # Host-side port only — everything inside the Compose network still talks
    # to sqlserver:1433. Override MSSQL_HOST_PORT if 1433 is taken on the host.
    ports:
      - "${MSSQL_HOST_PORT:-1433}:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    # -S 127.0.0.1, not localhost: localhost resolves to ::1 first inside the
    # container, and ODBC Driver 18 fails there rather than falling back to
    # IPv4, so the probe never succeeds no matter how long it waits.
    #
    # The probe must prove StarTrek is actually openable, not merely that master
    # answers. SQL Server logs "ready for client connections" once master, model
    # and tempdb are up, then starts user databases afterwards -- so on any
    # restart where the sqlserver-data volume already holds StarTrek, there is a
    # ~2s window where connections succeed but StarTrek is not up yet. Checking
    # sys.databases is NOT enough on its own: until SQL Server begins "Starting
    # up database 'StarTrek'" the row still serves master's persisted
    # state_desc = ONLINE, so the probe passes, sql-init starts, and dies
    # instantly with "Msg 904 ... Database 5 cannot be autostarted during server
    # shutdown or startup". The EXEC(N'USE StarTrek') runs the exact operation
    # init.sql and DAB perform, so it can only pass once they would too.
    # RAISERROR/Msg 904 + -b make sqlcmd exit non-zero, so the healthcheck just
    # retries until recovery is done. DB_ID guards the fresh-volume case, where
    # StarTrek does not exist yet and there is nothing to recover -- which is
    # why this race stays invisible until the second run.
    healthcheck:
      test: >-
        /opt/mssql-tools18/bin/sqlcmd -C -S 127.0.0.1 -U sa
        -P "$${MSSQL_SA_PASSWORD}" -b -o /dev/null
        -Q "SET NOCOUNT ON; IF EXISTS (SELECT 1 FROM sys.databases WHERE state_desc <> N'ONLINE') RAISERROR('databases still recovering', 16, 1); IF DB_ID(N'StarTrek') IS NOT NULL EXEC(N'USE StarTrek; SELECT 1;'); SELECT 1;"
      interval: 10s
      timeout: 15s
      retries: 10
      start_period: 30s

  # One-shot: creates the StarTrek database and loads schema + data, then exits.
  # -b matters: without it sqlcmd exits 0 even when the script errored, so a
  # failed load looks like success and you get an empty database instead.
  # init.sql drops and recreates everything, so re-running it is safe.
  sql-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    depends_on:
      sqlserver:
        condition: service_healthy
    volumes:
      - ./db-init:/scripts:ro
    entrypoint:
      - /opt/mssql-tools18/bin/sqlcmd
      - -C
      - -S
      - sqlserver
      - -U
      - sa
      - -P
      - "${MSSQL_SA_PASSWORD:?set MSSQL_SA_PASSWORD in .env - copy .env.example first}"
      - -b
      - -i
      - /scripts/init.sql
    restart: "no"

  # Data API builder's SQL MCP Server: turns the entities in dab-config.json
  # into REST, GraphQL, and MCP tools. No app code, just this container.
  dab:
    image: mcr.microsoft.com/azure-databases/data-api-builder:latest
    depends_on:
      sql-init:
        condition: service_completed_successfully
    environment:
      DATABASE_CONNECTION_STRING: >-
        Server=sqlserver,1433;Database=StarTrek;User ID=sa;
        Password=${MSSQL_SA_PASSWORD:?set MSSQL_SA_PASSWORD in .env - copy .env.example first};
        TrustServerCertificate=True;Encrypt=True;
    volumes:
      - ./dab/dab-config.json:/App/dab-config.json:ro
    ports:
      - "5000:5000"

  # The model runtime is NOT containerized: this talks to the Ollama you have
  # installed natively on the host, which keeps GPU acceleration and avoids a
  # second multi-GB copy of the model. host.docker.internal resolves to the
  # host from inside the container (extra_hosts makes that work on plain
  # Docker Engine too, not just Docker Desktop).
  blazor-app:
    build:
      context: ./src/StarTrekSqlAssistant.Web
    depends_on:
      - dab
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      Dab__McpEndpoint: "http://dab:5000/mcp"
      # Ollama (the default), OpenAI, or Anthropic. Only the selected
      # provider's settings below are read; the rest can stay unset.
      Model__Provider: "${MODEL_PROVIDER:-Ollama}"
      Ollama__Endpoint: "${OLLAMA_ENDPOINT:-http://host.docker.internal:11434}"
      Ollama__Model: "${OLLAMA_MODEL:-llama3.1}"
      OpenAI__ApiKey: "${OPENAI_API_KEY:-}"
      OpenAI__Model: "${OPENAI_MODEL:-gpt-4o-mini}"
      # Empty = api.openai.com. Set it for Azure OpenAI or any OpenAI-compatible gateway.
      OpenAI__Endpoint: "${OPENAI_ENDPOINT:-}"
      Anthropic__ApiKey: "${ANTHROPIC_API_KEY:-}"
      Anthropic__Model: "${ANTHROPIC_MODEL:-claude-haiku-4-5}"
    ports:
      - "8080:8080"
    # ASP.NET Data Protection keys (used to encrypt the antiforgery token) are
    # written inside the container. Without this volume every `up --build`
    # issues a fresh key ring, so any browser tab still holding a cookie from
    # the previous container fails with "The antiforgery token could not be
    # decrypted" and the page errors out before a question ever reaches the
    # model - with nothing in the app logs to explain it.
    #
    # The path is /home/app, not /root: the Dockerfile runs the app as the
    # non-root "app" user (uid 1654) and the key ring lives under that user's
    # home. The Dockerfile pre-creates and chowns this directory so Docker
    # seeds the volume with app ownership - keep the two paths in sync.
    volumes:
      - dataprotection-keys:/home/app/.aspnet/DataProtection-Keys

volumes:
  sqlserver-data:
  dataprotection-keys:
