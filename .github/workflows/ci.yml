name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege for GITHUB_TOKEN, set at the top so it applies to every job.
# Without it the token inherits the repository or organisation default, which
# can be read-write; nothing here writes to the repo - the build reads code, the
# tests read code, and the image is built but never pushed. Anything added later
# that does need to write (publishing a package, commenting on a PR) should widen
# the scope on that job alone rather than here.
permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore StarTrekSqlMPC-POC.slnx

      - name: Build
        run: dotnet build StarTrekSqlMPC-POC.slnx --configuration Release --no-restore

      # No Docker, no SQL Server, no model: every test runs against in-process
      # fakes, which is the point of the IChatClientFactory / IMcpToolProvider
      # seams. If a test here needs a container, it is in the wrong project.
      # dotnet test runs on Microsoft.Testing.Platform (global.json), so the
      # TRX report comes from xunit.v3's own reporter, not VSTest's --logger.
      - name: Test
        run: dotnet test StarTrekSqlMPC-POC.slnx --configuration Release --no-build --report-xunit-trx --report-xunit-trx-filename results.trx --results-directory artifacts/test-results

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: artifacts/test-results

  # The app image is part of the deliverable, so a change that breaks the
  # Dockerfile should fail CI rather than fail on someone's first
  # `docker compose up`. Build only - nothing is pushed anywhere.
  docker-image:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # The build context is the repository root, exactly as docker-compose.yml
      # sets it: the Dockerfile copies Directory.Build.props and
      # Directory.Packages.props before the csproj, because the csproj names
      # neither its TargetFramework nor its package versions.
      - name: Build the Blazor app image
        run: docker build -t startrek-sql-assistant:ci -f src/StarTrekSqlAssistant.Web/Dockerfile .
